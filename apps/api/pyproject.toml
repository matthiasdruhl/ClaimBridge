[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claimbridge-api"
version = "0.0.0"
description = "ClaimBridge preparation scaffold"
requires-python = ">=3.12"
dependencies = ["Flask>=3.1,<4", "pypdf==6.19.0", "jsonschema==4.26.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claimbridge = [
  "demo_fixtures/*.json",
  "demo_fixtures/*.md",
  "infrastructure/prompts/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
